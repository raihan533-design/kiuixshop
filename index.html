<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Metadata -->
    <title>KIUIXSHOP — Premium Tech Gear & Minimalist Essentials</title>
    <meta name="title" content="KIUIXSHOP — Premium Tech Gear & Minimalist Essentials" />
    <meta name="description" content="Discover precision-crafted tech gear, ergonomic desk setups, audio essentials, and everyday carry at KIUIXSHOP. Fast worldwide shipping, 100% secure Stripe payment, and 24/7 support." />
    <meta name="keywords" content="KIUIX, KIUIXSHOP, tech accessories, minimalist gadgets, premium audio, desk setups, everyday carry, sleek hardware, wireless chargers, mechanical keyboards" />
    <meta name="author" content="KIUIXSHOP" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kiuixshop.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kiuixshop.com/" />
    <meta property="og:title" content="KIUIXSHOP — Modern Tech & Lifestyle Essentials" />
    <meta property="og:description" content="Upgrade your digital workflow with KIUIXSHOP's curated collection of premium gadgets, smart desk tools, and minimalist accessories." />
    <meta property="og:image" content="/kiuix-logo.jpg" />
    <meta property="og:site_name" content="KIUIXSHOP" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kiuixshop.com/" />
    <meta property="twitter:title" content="KIUIXSHOP — Premium Tech Gear & Minimalist Essentials" />
    <meta property="twitter:description" content="Precision-crafted tech gear, ergonomic desk setups, and everyday carry. Powered by secure Stripe payments." />
    <meta property="twitter:image" content="/kiuix-logo.jpg" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/jpeg" href="/kiuix-logo.jpg" />
    <link rel="apple-touch-icon" href="/kiuix-logo.jpg" />
    <meta name="theme-color" content="#1d39f5" />

    <!-- Structured Data: Organization & Store Schema for Google Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "KIUIXSHOP",
      "url": "https://kiuixshop.com",
      "logo": "https://kiuixshop.com/kiuix-logo.jpg",
      "description": "Premium tech gear, minimalist everyday carry, and modern accessories with worldwide express delivery.",
      "email": "kiuixshop@gmail.com",
      "paymentAccepted": "Credit Card, Debit Card, Stripe, Apple Pay, Google Pay",
      "currenciesAccepted": "USD, EUR, GBP, BDT",
      "priceRange": "$$",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://kiuixshop.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
